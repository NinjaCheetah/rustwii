name: Build rustwii

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:

    runs-on: ubuntu-latest
    container:
      image: rust:bullseye

    steps:
    - uses: actions/checkout@v7
    # Not sure if this is the best choice, but I'm building in release mode to produce more effective nightly binaries.
    - name: Update Toolchain
      run: rustup update
    - name: Build rustwii
      run: cargo build --verbose --release --target x86_64-unknown-linux-gnu
    - name: Package rustwii for Upload
      run: |
        mv target/x86_64-unknown-linux-gnu/release/rustwii ~/rustwii
        cd ~
        tar cvf rustwii.tar rustwii
    - name: Upload rustwii
      uses: actions/upload-artifact@v7
      with:
        path: ~/rustwii.tar
        name: rustwii-Linux-x86_64-bin

  build-macos-arm64:
    
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Update Toolchain
      run: rustup update
    - name: Add ARM64 Target
      run: rustup target add aarch64-apple-darwin
    - name: Build rustwii
      run: cargo build --verbose --release --target aarch64-apple-darwin
    - name: Package rustwii for Upload
      run: |
        mv target/aarch64-apple-darwin/release/rustwii ~/rustwii
        cd ~
        tar cvf rustwii.tar rustwii
    - name: Upload rustwii
      uses: actions/upload-artifact@v7
      with:
        path: ~/rustwii.tar
        name: rustwii-macOS-arm64-bin

  build-macos-x86_64:
    
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v7
    - name: Update Toolchain
      run: rustup update
    - name: Add x86_64 Target
      run: rustup target add x86_64-apple-darwin
    - name: Build rustwii
      run: cargo build --verbose --release --target x86_64-apple-darwin
    - name: Package rustwii for Upload
      run: |
        mv target/x86_64-apple-darwin/release/rustwii ~/rustwii
        cd ~
        tar cvf rustwii.tar rustwii
    - name: Upload rustwii
      uses: actions/upload-artifact@v7
      with:
        path: ~/rustwii.tar
        name: rustwii-macOS-x86_64-bin

  build-windows-x86_64:
    
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - name: Update Toolchain
      run: rustup update
    - name: Build rustwii
      run: cargo build --verbose --release
    - name: Upload rustwii
      uses: actions/upload-artifact@v7
      with:
        path: D:\a\rustwii\rustwii\target\release\rustwii.exe
        name: rustwii-Windows-x86_64-bin

  build-windows-x86:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rust-src
    - name: Build rustwii
      run: cargo build -Z build-std --verbose --release --target i686-win7-windows-msvc
      env:
        RUSTC_BOOTSTRAP: 1
    - name: Upload rustwii
      uses: actions/upload-artifact@v7
      with:
        path: target/i686-win7-windows-msvc/release/rustwii.exe
        name: rustwii-Windows-x86-win7-bin
        
